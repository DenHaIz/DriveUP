# Builds DriveUP.exe and DriveUP_Pro.exe on every push and pull request; on a version tag
# (v1.1.0, ...) also publishes a GitHub Release with both exes and their SHA-256 checksums.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (in-box .NET Framework compiler, no SDK needed)
        shell: cmd
        run: build.cmd

      - name: Checksums
        shell: pwsh
        run: |
          foreach ($name in 'DriveUP.exe', 'DriveUP_Pro.exe') {
            $hash = (Get-FileHash "bin\$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File "bin\$name.sha256" -Encoding ascii
            Get-Content "bin\$name.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DriveUP
          path: |
            bin/DriveUP.exe
            bin/DriveUP.exe.sha256
            bin/DriveUP_Pro.exe
            bin/DriveUP_Pro.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin\DriveUP.exe bin\DriveUP.exe.sha256 bin\DriveUP_Pro.exe bin\DriveUP_Pro.exe.sha256 --title "DriveUP $env:GITHUB_REF_NAME" --generate-notes
